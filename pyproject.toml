[project]
name = "technoreceipt"
version = "0.3.0"
description = "Deterministic, DID-signed receipts for Technocore contribution evidence"
requires-python = ">=3.11"
dependencies = ["cryptography>=45"]

[project.scripts]
technoreceipt = "technoreceipt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technoreceipt"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
line-length = 100
